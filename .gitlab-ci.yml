stages:
  - test
  - build
  - deploy
  - cleanup

variables:
  BRANCH_BUILDER_IMAGE: golang:1.25
  BRANCH_NODE_IMAGE: node:24
  BRANCH_BINARY_NAME: branch-node
  BRANCH_DOCKER_PRUNE_UNTIL: 24h

go:
  stage: test
  tags:
    - branch_lc
  script:
    - deployments/gitlab/docker-cli.sh run --rm --user "$(id -u):$(id -g)" -v "$PWD:/src" -w /src -e HOME=/tmp -e GOMODCACHE=/tmp/gomodcache -e GOCACHE=/tmp/gocache -e GOPATH=/tmp/gopath "$BRANCH_BUILDER_IMAGE" deployments/gitlab/go-checks.sh

web:
  stage: test
  tags:
    - branch_lc
  cache:
    key:
      files:
        - web/package-lock.json
    paths:
      - web/.npm/
  script:
    - deployments/gitlab/docker-cli.sh run --rm --user "$(id -u):$(id -g)" -v "$PWD:/src" -w /src/web -e HOME=/tmp -e npm_config_cache=/src/web/.npm "$BRANCH_NODE_IMAGE" sh -lc 'npm ci --prefer-offline --fetch-retries=5 --fetch-retry-maxtimeout=120000 --fetch-timeout=120000 && npm run typecheck && npm run lint && npm test'
  rules:
    - when: manual
      allow_failure: true

build:branch-node:
  stage: build
  tags:
    - branch_lc
  script:
    - mkdir -p dist
    - deployments/gitlab/docker-cli.sh run --rm --user "$(id -u):$(id -g)" -v "$PWD:/src" -w /src -e HOME=/tmp -e CGO_ENABLED=0 -e GOOS=linux -e GOARCH=amd64 -e GOMODCACHE=/tmp/gomodcache -e GOCACHE=/tmp/gocache "$BRANCH_BUILDER_IMAGE" go build -trimpath -ldflags="-s -w" -o "dist/${BRANCH_BINARY_NAME}-linux-amd64" ./cmd/branch-node
    - deployments/gitlab/docker-cli.sh run --rm --user "$(id -u):$(id -g)" -v "$PWD:/src" -w /src -e HOME=/tmp -e CGO_ENABLED=0 -e GOOS=linux -e GOARCH=arm64 -e GOMODCACHE=/tmp/gomodcache -e GOCACHE=/tmp/gocache "$BRANCH_BUILDER_IMAGE" go build -trimpath -ldflags="-s -w" -o "dist/${BRANCH_BINARY_NAME}-linux-arm64" ./cmd/branch-node
  artifacts:
    expire_in: 1 day
    paths:
      - dist/branch-node-linux-amd64
      - dist/branch-node-linux-arm64
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

.deploy_branch_node:
  stage: deploy
  needs:
    - job: build:branch-node
      artifacts: true
  variables:
    BRANCH_WSS_ORIGIN_PATTERNS: branch.undoo.ru
  script:
    - deployments/gitlab/deploy-branch-node.sh
  artifacts:
    when: always
    expire_in: 1 day
    paths:
      - relay-artifacts/
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: on_success
  allow_failure: false

deploy:relay01:
  extends: .deploy_branch_node
  tags:
    - branch_nd
  variables:
    BRANCH_RELAY_NAME: relay01
    BRANCH_RELAY_ENV_PREFIX: BRANCH_RELAY01
    BRANCH_PROXY_PORT: "8088"
    BRANCH_ADMIN_HOST_PORT: "18081"
  environment:
    name: relay/relay01

deploy:relay02:
  extends: .deploy_branch_node
  tags:
    - branch_nd
  variables:
    BRANCH_RELAY_NAME: relay02
    BRANCH_RELAY_ENV_PREFIX: BRANCH_RELAY02
    BRANCH_PROXY_PORT: "8089"
    BRANCH_ADMIN_HOST_PORT: "18082"
  environment:
    name: relay/relay02

deploy:relay04:
  extends: .deploy_branch_node
  tags:
    - branch_lc
  variables:
    BRANCH_RELAY_NAME: relay04
    BRANCH_RELAY_ENV_PREFIX: BRANCH_RELAY04
    BRANCH_PROXY_PORT: "8092"
    BRANCH_ADMIN_HOST_PORT: "18084"
  environment:
    name: relay/relay04

deploy:relay05:
  extends: .deploy_branch_node
  tags:
    - branch_lc
  variables:
    BRANCH_RELAY_NAME: relay05
    BRANCH_RELAY_ENV_PREFIX: BRANCH_RELAY05
    BRANCH_PROXY_PORT: "8093"
    BRANCH_ADMIN_HOST_PORT: "18085"
  environment:
    name: relay/relay05

.cleanup_docker:
  stage: cleanup
  script:
    - deployments/gitlab/docker-cli.sh container prune -f || true
    - deployments/gitlab/docker-cli.sh builder prune -af --filter "until=${BRANCH_DOCKER_PRUNE_UNTIL}" || true
    - deployments/gitlab/docker-cli.sh image prune -af --filter "label=org.branch.role=relay-node" || true
    - deployments/gitlab/docker-cli.sh image prune -f --filter "until=${BRANCH_DOCKER_PRUNE_UNTIL}" || true
    - if [ "${BRANCH_DOCKER_PRUNE_ALL:-0}" = "1" ]; then deployments/gitlab/docker-cli.sh image prune -af --filter "until=${BRANCH_DOCKER_PRUNE_UNTIL}" || true; fi
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: on_success
  allow_failure: true

cleanup:relay01:
  extends: .cleanup_docker
  tags:
    - branch_nd

cleanup:relay02:
  extends: .cleanup_docker
  tags:
    - branch_nd

cleanup:relay04:
  extends: .cleanup_docker
  tags:
    - branch_lc

cleanup:relay05:
  extends: .cleanup_docker
  tags:
    - branch_lc
