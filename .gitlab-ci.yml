stages:
  - test
  - build
  - deploy
  - cleanup

variables:
  BRANCH_BUILDER_IMAGE: golang:1.25
  BRANCH_NODE_IMAGE: node:24
  BRANCH_BINARY_NAME: branch-node
  BRANCH_DOCKER_PRUNE_UNTIL: 24h

go:
  stage: test
  tags:
    - branch_nd
  script:
    - docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/src" -w /src -e HOME=/tmp -e GOMODCACHE=/tmp/gomodcache -e GOCACHE=/tmp/gocache -e GOPATH=/tmp/gopath "$BRANCH_BUILDER_IMAGE" deployments/gitlab/go-checks.sh

web:
  stage: test
  tags:
    - branch_nd
  cache:
    key:
      files:
        - web/package-lock.json
    paths:
      - web/.npm/
  script:
    - docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/src" -w /src/web -e HOME=/tmp -e npm_config_cache=/src/web/.npm "$BRANCH_NODE_IMAGE" sh -lc 'npm ci --prefer-offline --fetch-retries=5 --fetch-retry-maxtimeout=120000 --fetch-timeout=120000 && npm run typecheck && npm run lint && npm test'

build:branch-node:
  stage: build
  tags:
    - branch_nd
  script:
    - mkdir -p dist
    - docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/src" -w /src -e HOME=/tmp -e CGO_ENABLED=0 -e GOOS=linux -e GOARCH=amd64 -e GOMODCACHE=/tmp/gomodcache -e GOCACHE=/tmp/gocache "$BRANCH_BUILDER_IMAGE" go build -trimpath -ldflags="-s -w" -o "dist/${BRANCH_BINARY_NAME}-linux-amd64" ./cmd/branch-node
    - docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/src" -w /src -e HOME=/tmp -e CGO_ENABLED=0 -e GOOS=linux -e GOARCH=arm64 -e GOMODCACHE=/tmp/gomodcache -e GOCACHE=/tmp/gocache "$BRANCH_BUILDER_IMAGE" go build -trimpath -ldflags="-s -w" -o "dist/${BRANCH_BINARY_NAME}-linux-arm64" ./cmd/branch-node
  artifacts:
    expire_in: 1 day
    paths:
      - dist/branch-node-linux-amd64
      - dist/branch-node-linux-arm64
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

.deploy_branch_node:
  stage: deploy
  needs:
    - job: build:branch-node
      artifacts: true
  script:
    - deployments/gitlab/deploy-branch-node.sh
  artifacts:
    when: always
    expire_in: 1 day
    paths:
      - relay-artifacts/
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
  allow_failure: false

deploy:relay_nd:
  extends: .deploy_branch_node
  tags:
    - branch_nd
  variables:
    BRANCH_RELAY_NAME: relay_nd
    BRANCH_RELAY_ENV_PREFIX: BRANCH_ND
    BRANCH_PROXY_PORT: "8088"
    BRANCH_ADMIN_HOST_PORT: "18081"
  environment:
    name: relay/nd

deploy:relay_fr_on_nd:
  extends: .deploy_branch_node
  tags:
    - branch_nd
  variables:
    BRANCH_RELAY_NAME: relay_fr
    BRANCH_RELAY_ENV_PREFIX: BRANCH_FR
    BRANCH_PROXY_PORT: "8089"
    BRANCH_ADMIN_HOST_PORT: "18082"
  environment:
    name: relay/fr-on-nd

.cleanup_docker:
  stage: cleanup
  script:
    - docker container prune -f || true
    - docker builder prune -af --filter "until=${BRANCH_DOCKER_PRUNE_UNTIL}" || true
    - docker image prune -af --filter "label=org.branch.role=relay-node" || true
    - docker image prune -f --filter "until=${BRANCH_DOCKER_PRUNE_UNTIL}" || true
    - if [ "${BRANCH_DOCKER_PRUNE_ALL:-0}" = "1" ]; then docker image prune -af --filter "until=${BRANCH_DOCKER_PRUNE_UNTIL}" || true; fi
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
  allow_failure: true

cleanup:relay_nd:
  extends: .cleanup_docker
  tags:
    - branch_nd

cleanup:relay_fr_on_nd:
  extends: .cleanup_docker
  tags:
    - branch_nd
