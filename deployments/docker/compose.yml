services:
  branch-node:
    build:
      context: .
      dockerfile: branch-node.Dockerfile
    image: ${BRANCH_IMAGE_NAME}
    restart: unless-stopped
    environment:
      BRANCH_ADMIN_TOKEN: ${BRANCH_ADMIN_TOKEN}
    command:
      - -listen
      - 0.0.0.0:8080
      - -admin-listen
      - 0.0.0.0:8081
      - -identity
      - /var/lib/branch/node-identity.json
    ports:
      - "127.0.0.1:${BRANCH_ADMIN_HOST_PORT}:8081"
    volumes:
      - branch-node-state:/var/lib/branch

  branch-relay-nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - branch-node
    ports:
      - "${BRANCH_PROXY_BIND}:${BRANCH_PROXY_PORT}:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  branch-node-state:
