map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

server {
  listen 8080;
  server_name _;
  # Docker can replace branch-node with a new container IP during deploy or
  # recovery. Resolving through its embedded DNS at request time avoids an
  # otherwise healthy relay becoming a persistent 502 until nginx is restarted.
  resolver 127.0.0.11 ipv6=off valid=10s;
  resolver_timeout 5s;
  set $branch_node_upstream branch-node;

  location = /relay/v0 {
    proxy_pass http://$branch_node_upstream:8080/relay/v0;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
  }

  location / {
    return 404;
  }
}
