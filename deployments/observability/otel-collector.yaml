receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
  batch:
    timeout: 1s
    send_batch_size: 1024
  attributes/branch_redaction:
    actions:
      - key: payload
        action: delete
      - key: private_key
        action: delete
      - key: capability_token
        action: delete
      - key: identity_export
        action: delete
      - key: authentication_secret
        action: delete
      - key: user_id
        action: delete
      - key: public_key
        action: delete
      - key: session_id
        action: delete
      - key: message_id
        action: delete
      - key: ip_address
        action: delete
      - key: relay_url
        action: delete

exporters:
  debug:
    verbosity: basic
  prometheus:
    endpoint: 0.0.0.0:9464
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, attributes/branch_redaction, batch]
      exporters: [otlp/tempo]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, attributes/branch_redaction, batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, attributes/branch_redaction, batch]
      exporters: [debug]

