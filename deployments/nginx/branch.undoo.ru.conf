server {
  listen 80;
  listen [::]:80;
  server_name branch.undoo.ru;

  root /home/code4bones/Devs/coding/BRANCH/web/dist;
  index index.html;

  client_max_body_size 1m;
  server_tokens off;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header X-Frame-Options "DENY" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'none'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https://api.github.com https://raw.githubusercontent.com https://gitlab.com wss://branch.undoo.ru:443 wss://relay01.undoo.ru:443 wss://relay02.undoo.ru:443 wss://relay04.undoo.ru:443 wss://relay05.undoo.ru:443; manifest-src 'self'; worker-src 'self'" always;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location /node-admin/ {
    proxy_pass http://127.0.0.1:8081/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /relay/v0 {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 75s;
  }

  location = /admin {
    auth_basic "B.R.A.N.C.H. beta";
    auth_basic_user_file /home/code4bones/Devs/coding/BRANCH/.branch.htpasswd;
    return 301 /admin/;
  }

  location /admin/ {
    auth_basic "B.R.A.N.C.H. beta";
    auth_basic_user_file /home/code4bones/Devs/coding/BRANCH/.branch.htpasswd;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'none'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https://api.github.com https://raw.githubusercontent.com https://gitlab.com wss://branch.undoo.ru:443 wss://relay01.undoo.ru:443 wss://relay02.undoo.ru:443 wss://relay04.undoo.ru:443 wss://relay05.undoo.ru:443; manifest-src 'self'; worker-src 'self'" always;
    try_files $uri $uri/ /admin/index.html;
  }

  location = /pwa {
    return 301 /pwa/;
  }

  location = /pwa/sw.js {
    alias /home/code4bones/Devs/coding/BRANCH/pwa/dist/sw.js;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'none'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https://api.github.com https://raw.githubusercontent.com https://gitlab.com wss://branch.undoo.ru:443 wss://relay01.undoo.ru:443 wss://relay02.undoo.ru:443 wss://relay04.undoo.ru:443 wss://relay05.undoo.ru:443; manifest-src 'self'; worker-src 'self'" always;
  }

  location /pwa/ {
    alias /home/code4bones/Devs/coding/BRANCH/pwa/dist/;
    try_files $uri $uri/ /pwa/index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'none'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https://api.github.com https://raw.githubusercontent.com https://gitlab.com wss://branch.undoo.ru:443 wss://relay01.undoo.ru:443 wss://relay02.undoo.ru:443 wss://relay04.undoo.ru:443 wss://relay05.undoo.ru:443; manifest-src 'self'; worker-src 'self'" always;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
